# Inventario de hosts de la capacidad sysadmin-lan (SINGLE SOURCE OF TRUTH).
# t_2c9322f1: gpu-host (primer host). t_74f5f315: services-host (segundo).
# ssh_users verificados por sondeo real el 2026-09-14 (el body del mediador
# decia "user", pero el acceso SSH que funciona es hermesuser en gpu-host e
# iinstances en services-host).
hosts:
  - id: gpu-host
    ip: 192.168.1.32
    name: ml-host
    role: vLLM inference server (4060 Ti 16GB)
    ssh_user: hermesuser
    ssh_key: ~/.ssh/id_ed25519
    permissions:
      - read_status          # nvidia-smi, systemctl status, journalctl, free, df, ps
      - restart_services     # systemctl --user restart/stop/start vllm, vllm-rounds
      - manage_models        # huggingface-cli download, vllm serve, cambiar modelo
      - manage_packages      # pip install/show/uninstall ... vllm (nunca apt)
      - read_files           # cat, head, tail, grep, ls, find, stat (read-only)
      - edit_vllm_config     # escribir SOLO configs de vLLM (/data/ml, no /etc)
    deny:
      - edit_credentials     # nunca SSH keys, authorized_keys, .env, tokens
      - change_network       # no iptables, networkd, nmcli, sysctl -w
      - system_packages      # no apt install/dpkg/snap
      - delete_data          # no rm, dd, mkfs, shred, truncate

  # t_74f5f315 (MEDIATOR 2026-09-14): services host — segundo host managed.
  # ssh_user verificado por sondeo real el 2026-09-14 (iinstances@, BatchMode
  # OK). Todo el software NUEVO va en containers (docker compose); Docker
  # Root Dir ya vive en /data/docker (159G libres) — el disco raíz (91% usado)
  # queda fuera del alcance del stack de observabilidad.
  # t_5d573ffc (MEDIATOR 2026-09-15): regla permanente — respetar / y usar
  # /data para todo (manifest.yaml host_rules). Exigida por el guard como
  # deny write_root_disk: todo destino de escritura absoluto debe vivir en
  # /data o en ~/git/docker-compose/** (ambos en el disco de datos).
  - id: services-host
    ip: 192.168.1.23
    name: services
    role: Docker host (Open WebUI :3001, iSponsorBlockTV, observability stack)
    ssh_user: iinstances
    ssh_key: ~/.ssh/id_ed25519
    permissions:
      - read_status          # docker ps, docker compose ps, free, df, ss, journalctl
      - read_files           # cat/ls/tail/grep read-only (inspeccion del arbol compose)
      - restart_containers   # docker restart / docker compose restart
      - manage_compose       # docker compose up -d / stop / pull (services existentes)
      - edit_compose_files   # escribir SOLO en ~/git/docker-compose/**
      - deploy_services      # desplegar nuevos servicios via compose (observability)
      - manage_volumes       # docker volume create/ls/inspect (nunca prune)
      - read_logs            # docker logs, journalctl (read-only)
    deny:
      - edit_credentials     # nunca SSH keys, authorized_keys, .env con secretos
      - system_packages      # no apt install/dpkg/snap (todo via containers)
      - change_network       # no iptables, netplan, nmcli, sysctl -w
      - delete_data          # no rm -rf, docker system prune, volume rm
      - write_root_disk      # no escribir fuera de /data y ~/git/docker-compose/**
