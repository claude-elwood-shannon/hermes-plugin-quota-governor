name: sysadmin-lan
description: Gestion sysadmin de hosts en la LAN
version: 1.0.0
objective: OBJ-SYSADMIN

permissions:
  ssh: true
  ssh_hosts: [gpu-host, services-host]   # solo hosts del inventario
  system_paths: [/etc/systemd, /var/log]
  reversible_actions: [restart, reload, enable, disable, start, stop]
  irreversible_actions: []       # nada irreversible sin approval humano

triggers:
  - task_body_contains: "[capability: sysadmin-lan]"
  - task_title_contains: "gpu-host"
  - task_title_contains: "ml-host"
  - task_title_contains: "services-host"
  - task_title_contains: "observability"
  - objective: OBJ-SYSADMIN

# Reglas del host services-host (192.168.1.23), t_5d573ffc:
# - Respetar / — disco raiz al 91%, NO instalar nada ahi
# - Usar /data para todo: volumenes docker, datos de servicios, logs
# - Docker Root ya en /data/docker — mantener este patron
host_rules:
  services-host:
    disk_root: "91% — NO usar"
    data_path: "/data"
    docker_root: "/data/docker"
    note: "Toda instalación, volumen o dato nuevo debe ir en /data"

# Inventario de hosts: ~/.hermes/data/capabilities/sysadmin-lan/hosts.yaml
# (principio plugin=código, ~/.hermes/=datos — t_7d102e2b; contiene IPs y
# permisos específicos de esta casa, no código compartible).
hosts_file: ~/.hermes/data/capabilities/sysadmin-lan/hosts.yaml
