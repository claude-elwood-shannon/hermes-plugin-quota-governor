[pytest]
# The repo root has __init__.py (it's an installed plugin package). Without
# confcutdir, pytest walks up from tests/ and tries to import that root
# __init__.py, which uses relative imports → "attempted relative import with
# no known parent package". confcutdir=tests stops the walk at tests/.
#
# import-mode=importlib (t_a8a4418c): tres basenames viven DUPLICADOS entre
# la raiz y tests/ (test_quota_gate, test_tick_cola_viva, test_vllm_invoke)
# y no hay paquete tests/ — en el modo prepend por defecto el modulo
# 'test_quota_gate' importado desde la raiz entra en sys.modules y la
# coleccion de tests/test_quota_gate.py muere con "import file mismatch"
# (37 errores de coleccion en la primera pasada completa del repo). Las
# tandas historicas (65/65) nunca lo vieron porque corrian ficheros
# aislados por ruta explicita. importlib no usa sys.modules por basename.
addopts = --confcutdir=tests --import-mode=importlib